name: Estimate PV contributing drainage
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - "data/reference/**"
      - ".github/workflows/analyze.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pv-drainage-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/analyze.py
      - name: Commit source snapshots and checked results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results docs README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish checked PV drainage estimate and public source snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pv-drainage-analysis
          path: |
            results/
            data/source_manifest.json
            data/raw/
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
