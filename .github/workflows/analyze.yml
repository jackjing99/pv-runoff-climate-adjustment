name: Estimate PV contributing drainage
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - "data/reference/**"
      - ".github/workflows/analyze.yml"
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pv-drainage-analysis
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reuse previous cloud source snapshots when bootstrapping
        if: hashFiles('data/raw/nhd_network_0.geojson') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pv-drainage-analysis
          run-id: 45482877983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - run: pip install -r requirements.txt
      - run: python src/analyze.py
      - name: Commit source snapshots and checked results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results docs README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish checked PV drainage estimate and public source snapshots"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pv-drainage-analysis
          path: |
            results/
            data/source_manifest.json
            data/raw/
          retention-days: 30
      - name: Request publication of the committed report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, requests
          base = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          response = requests.post(base + "/pages/builds", headers=headers, timeout=40)
          response.raise_for_status()
          print("Pages build requested:", response.json().get("status"))
          PY
